# Dispara a rotina de alertas/automações do sistema a cada hora.
# Configure em Settings → Secrets and variables → Actions: APP_URL e CRON_SECRET.
name: Rotina de automações

on:
  schedule:
    - cron: "7 * * * *" # a cada hora (UTC), minuto 7
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/cron/sweep
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL/CRON_SECRET não configurados — nada a fazer."
            exit 0
          fi
          # --retry cobre o tempo de "acordar" do plano gratuito do Render
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$APP_URL/api/cron/sweep" \
            -H "Authorization: Bearer $CRON_SECRET"
